      completed_at:
        type: string
      is_latest_dataset_run:
        type: string
      is_latest_successful_dataset_run:
        type: string
      purge_completed_at:
        type: string
      purge_started_at:
        type: string
      dataset_has_failures_since_last_success:
        type: string
      state:
        enum:
        - pending
        - enqueued
        - cancelled
        - failed
        - succeeded
        - completed
        type: string
      token:
        type: string
      updated_at:
        type: string
      pusher_channel_name:
        type: string
      _links:
        $ref: '#/definitions/DatasetRunLinks'
      _embedded:
        $ref: '#/definitions/DatasetRunEmbeds'
    required:

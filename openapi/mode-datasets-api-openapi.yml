      executed_by:
        $ref: '#/definitions/Link'
      latest_successful_dataset_run_api_url:
        $ref: '#/definitions/Link'
      dataset:
        $ref: '#/definitions/Link'
      query_runs:
        $ref: '#/definitions/Link'
      share:
        $ref: '#/definitions/Link'

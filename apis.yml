aid: mode
name: Mode
description: >-
  Mode is a collaborative business intelligence and analytics platform that unites data
  and business teams around a single analytical workflow. Built by analysts for analysts,
  Mode combines ad hoc SQL exploration, Python and R notebooks, interactive dashboards,
  self-serve reporting, and custom data applications on top of connected data warehouses.
  Mode was acquired by ThoughtSpot in 2023 and positions itself as the intelligence layer
  for the modern data stack. Mode exposes a REST API (documented at its Developer Hub) for
  programmatic management of workspaces, users, collections, data sources, reports, queries,
  charts, datasets, definitions, exports, report schedules, and subscriptions. The API uses
  HTTP Basic authentication with workspace or personal API tokens and returns HAL+JSON, and
  is available to workspaces on a paid Mode Business plan.
